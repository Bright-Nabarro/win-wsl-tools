# Windows Terminal -> OpenSSH -> tmux clipboard integration.
# tmux 3.7b already keeps a 500 ms response window while it has an active
# terminal query; deliberately leave escape-time at its safer default.

# Send tmux copy-mode selections to the client clipboard with OSC 52.
# "external" keeps untrusted programs in panes from setting the clipboard.
set -s set-clipboard external

# Windows Terminal presents xterm-256color over SSH. Declare OSC 52 support
# explicitly so clipboard copying remains available even without an Ms
# terminfo capability on the server.
set -as terminal-features ',xterm-256color:clipboard'

# Start fish instead of the account's login shell (which is bash).
# tmux execs default-shell as a login shell when default-command is unset,
# so no separate default-command is needed. A full path is required here.
set -g default-shell /usr/bin/fish

# Enable mouse mode: select panes/windows, resize panes, and scroll in copy
# mode with the mouse.
set -g mouse on

# New windows (and panes) inherit the current pane's working directory,
# instead of dropping to the session's start directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Ctrl-b h / Ctrl-b l: switch to the previous / next window.
# (Overrides the default l "last-window" binding; h was unbound.)
bind h previous-window
bind l next-window

# Ctrl-b H / Ctrl-b L: move the current window left / right (swap one step).
# (Overrides default L "switch-client -l"; H was unbound.)
bind H swap-window -t :-1
bind L swap-window -t :+1
